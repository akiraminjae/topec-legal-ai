# 공통 서비스 정의 — 호스트 포트는 여기서 열지 않습니다.
#   로컬 개발: docker-compose.override.yml 이 자동으로 함께 로드되어 포트를 엽니다.
#   운영 서버: .env 의 COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#             (Caddy 리버스 프록시만 80/443 공개, DB·MinIO는 외부 비공개)
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topec}
      POSTGRES_DB: ${POSTGRES_DB:-topec_legal_ai}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topec}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-topec_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-topec_minio_secret}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  libreoffice:
    build:
      context: ./infrastructure/docker/libreoffice
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_KAKAO_JS_KEY: ${NEXT_PUBLIC_KAKAO_JS_KEY:-}
    env_file: .env
    expose:
      - "3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
