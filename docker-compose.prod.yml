# 운영 서버 전용 — .env 에 COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml 로 지정합니다.
# 외부에는 Caddy(80/443)만 열고, API는 서버 내부(127.0.0.1)에서만 접근됩니다.
# TLS는 앞단 Cloudflare가 처리하고 Caddy는 :80 으로 받습니다(infrastructure/caddy/Caddyfile).
services:
  api:
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:
